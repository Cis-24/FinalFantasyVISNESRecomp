# Bewusst geduldete ROM-Misses fuer miss_report.py. Jeder Eintrag braucht eine Begruendung
# (reason) und den Weg zur Aufloesung (resolve). WRAM-Ziele (7E/7F) sind ohnehin Allowlist.
# Format:
#   [[miss]]
#   target  = 0xC09A5A         # Ziel-PC24
#   mx      = "M1X0"           # Eintrittsbreite der Discovery
#   reason  = "..."
#   resolve = "..."

# Entscheidung 2026-10-29 (Nutzer): die Misses vorerst dulden und zuerst den Phase-5-Rest
# erledigen. Mit dem 609er-Stand (2026-10-30, Pin 1933c214865e) sind ExecEvent, EventCmd_b2 und
# EventCmd_a9 aufgeloest; es bleibt LoadMap.

[[miss]]
target = 0xC0BEBC
mx = "M1X0"
reason = "LoadMap: unproven_call_at_C0C06E_to_C09A5A_m1x0 (ExecEvent ist AOT, aber seine Exit-Breite ist unbewiesen)"
resolve = "Exit-Breite von ExecEvent belegen; haengt an den Dispatch-Zielen und der Menue-Kette C0C6CA -> C30000, s. docs/STATUS.md"

# r02/r03 (2026-10-30): Der Analyzer hat hier recht, die Funktionen bleiben im Interpreter.
# entrance.asm:120/300: `jsr SetParentMap` kehrt mit M=1 zurueck (shorta0, entrance.asm:230), der
# Aufrufer ist danach als .a16 assembliert (`and #$01ff`, entrance.asm:122). Das ergibt
# authority_conflict in beiden Eingangs-Pruefungen und truncated_call_continuation in CheckEntrances.

[[miss]]
target = 0xC018A3
mx = "M1X0"
reason = "CheckEntrances: truncated_call_continuation, Callees CheckLongEntrance/CheckShortEntrance sind lle_only"
resolve = "wie CheckLongEntrance; Kosten gering (wenige Instruktionen je Frame)"

[[miss]]
target = 0xC018E4
mx = "M1X0"
reason = "CheckLongEntrance: authority_conflict_at_C01973_m1x0_from_196F (M=1 nach jsr SetParentMap)"
resolve = "Geprueft 2026-10-31: Long-Tabelle ohne Bit $0200, Short-Tabelle nur auf den Weltkarten $000/$001, im Field also unerreichbar. Pfad liesse sich per cfg ausschliessen; lohnt nicht (0,4 Mio. Zyklen ueber r02, r03 und r10), docs/STATUS.md"

[[miss]]
target = 0xC01A77
mx = "M1X0"
reason = "CheckShortEntrance: authority_conflict_at_C01ABA_m1x0_from_1AB6 (M=1 nach jsr SetParentMap)"
resolve = "wie CheckLongEntrance"

# Pin-Session 2026-11-05 (snesrecomp 7b570a032de3): Die Sperre von ValidateSpellList ist aufgehoben. Der Fix im
# Framework haelt jmp (AddToSpellListTbl,x) in der Funktion, solange ihr Pfad das php haelt; ValidateSpellList,
# InitChars und InitBattle sind AOT, ihre Eintraege und die Landungen C25704/C2570E sind entfallen. Battle_ext bleibt
# LLE-only, weil BattleLoop in seinem Graphen CheckBattleEnd aufruft (Eintrag unten).

[[miss]]
target = 0xC20000
mx = "M1X0"
reason = "Battle_ext: unproven_call_at_C20081_to_C247ED_m1x1 (BattleLoop im eigenen Graphen ruft CheckBattleEnd, Eintrag unten)"
resolve = "wie CheckBattleEnd"

# r05 (2026-11-05): Nach den Exit-Breiten fuer die CheckStatus-Aufrufer, ExecAttack und AIRand3
# (recomp/bankc2.cfg) bleibt CheckBattleEnd. Es verwirft auf mehreren Wegen die eigene
# Ruecksprungadresse (pla/pla) und springt nach TerminateBattle, BattleLoop oder ueber
# CheckFinalBattle/BattleEnd_06 nach RestartBattle (battle_end.asm:94-96, 135-139, 369-371, 388-390).
# Damit liegt InitBattle im eigenen Graphen, und die Kette endet in der gesperrten ValidateSpellList.

[[miss]]
target = 0xC247ED
mx = "M1X1"
reason = "CheckBattleEnd: unproven_call_at_C2483D_to_C24A76_m1x1 und unproven_call_at_C20081_to_C247ED_m1x1 (BattleLoop im eigenen Graphen). Seit der Pin-Session 2026-11-05 halten allein die pla/pla-Ausgaenge die Variante LLE-only: Sie verwerfen die eigene Ruecksprungadresse, dafuer gibt es keine Exit-Breite"
resolve = "Framework-Fakt fuer Ausgaenge, die die eigene Ruecksprungadresse verwerfen (verwandt mit Callee raeumt N Byte ab, docs/STATUS.md); bis dahin dulden"
