# Masken fuer compare_dumps.py. Jede Maske braucht eine Begruendung (reason).
# Format:
#   [[mask]]
#   file   = "wram"            # wram | vram | cgram | oam | fb
#   start  = 0x1234            # Byte-Offset (fb: Pixelindex y*256+x)
#   end    = 0x1237            # inklusiv
#   rect   = [x0, y0, x1, y1]  # nur fb, statt start/end: Rechteck inklusiv, eine Zeile je Bereich
#   reason = "..."
#   tags   = ["title"]         # optional: nur fuer diese Dump-Tags

[[mask]]
file   = "wram"
start  = 0x1508
end    = 0x15EC
reason = """Toter CPU-Stack unter dem lebenden Titel-Frame. Stack $1508-$15FF \
(ff6 notes/field-ram.txt:881, S=$15FF ab field/reset.asm:17). Im Titel wartet der \
Hauptloop in WaitVBlank mit S=$15EC: Der Referenzdump traegt bei $15E9-EC den NMI-Frame \
P=$A1/PC=$7E7208 (lda $17/bne). $15ED-$15FF (C000DD, C0B96F, $50BD) ist in Ref und \
Recomp gleich und bleibt geprueft. Unterhalb von S haengt der Inhalt nur davon ab, ob \
der Dump vor oder nach dem NMI des Frames liegt (Ref: NMI-Frame, Recomp: \
JSR-Ruecksprungadressen $753B/$7558 der Sprite-Routine). Nachweis 2026-10-29, docs/STATUS.md."""
tags   = ["title"]

